services:
  taskflow-postgres:
    container_name: taskflow-postgres
    image: postgres:latest
    environment:
      POSTGRES_DB: TaskFlowDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - taskflow_pgdata:/var/lib/postgresql
      - ./docker/init-extra-dbs.sql:/docker-entrypoint-initdb.d/init-extra-dbs.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TaskFlowDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  taskflow-pgadmin:
    container_name: taskflow-pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - taskflow_pgadmin:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json
    depends_on:
      taskflow-postgres:
        condition: service_healthy
    restart: unless-stopped

  taskflow-redis:
    container_name: taskflow-redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - taskflow_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  taskflow-redisinsight:
    container_name: taskflow-redisinsight
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - taskflow_redisinsight:/data
    depends_on:
      taskflow-redis:
        condition: service_healthy
    restart: unless-stopped

  taskflow-rabbitmq:
    container_name: taskflow-rabbitmq
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: taskflow
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - taskflow_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  taskflow-kafka:
    container_name: taskflow-kafka
    hostname: taskflow-kafka
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://taskflow-kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@taskflow-kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  taskflow-kafka-init:
    container_name: taskflow-kafka-init
    image: apache/kafka:3.9.0
    depends_on:
      taskflow-kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server taskflow-kafka:19092 --create --if-not-exists --topic taskflow.events --partitions 3 --replication-factor 1 && exit 0
          sleep 2
        done
        exit 1
    restart: "no"

  taskflow-api:
    container_name: taskflow-api
    build:
      context: .
      dockerfile: API/Dockerfile
    ports:
      - "5031:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: Host=taskflow-postgres;Port=5432;Database=TaskFlowDB;Username=postgres;Password=password
      ConnectionStrings__Redis: taskflow-redis:6379,abortConnect=false,connectTimeout=1000
      Jwt__Key: TaskFlowLocalDevKey_ChangeMe_32chars!
      Jwt__Issuer: TaskFlow
      Jwt__Audience: TaskFlow
      RabbitMQ__Host: taskflow-rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: taskflow
      RabbitMQ__Password: password
      RabbitMQ__VirtualHost: /
      Kafka__BootstrapServers: taskflow-kafka:19092
      Kafka__Topic: taskflow.events
    depends_on:
      taskflow-postgres:
        condition: service_healthy
      taskflow-redis:
        condition: service_healthy
      taskflow-rabbitmq:
        condition: service_healthy
      taskflow-kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  taskflow-analytics:
    container_name: taskflow-analytics
    build:
      context: .
      dockerfile: Analytics/Dockerfile
    ports:
      - "5040:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Analytics: Host=taskflow-postgres;Port=5432;Database=TaskFlowAnalytics;Username=postgres;Password=password
      Jwt__Key: TaskFlowLocalDevKey_ChangeMe_32chars!
      Jwt__Issuer: TaskFlow
      Jwt__Audience: TaskFlow
      Kafka__BootstrapServers: taskflow-kafka:19092
      Kafka__Topic: taskflow.events
      Kafka__ConsumerGroup: taskflow-analytics
      Kafka__ResetToBeginning: "false"
    depends_on:
      taskflow-postgres:
        condition: service_healthy
      taskflow-kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  taskflow-notification:
    container_name: taskflow-notification
    build:
      context: .
      dockerfile: Notification/Dockerfile
    ports:
      - "5032:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: TaskFlowLocalDevKey_ChangeMe_32chars!
      Jwt__Issuer: TaskFlow
      Jwt__Audience: TaskFlow
      RabbitMQ__Host: taskflow-rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: taskflow
      RabbitMQ__Password: password
      RabbitMQ__VirtualHost: /
    depends_on:
      taskflow-rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  taskflow-web:
    container_name: taskflow-web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - taskflow-api
      - taskflow-analytics
      - taskflow-notification
    restart: unless-stopped

volumes:
  taskflow_pgdata:
  taskflow_pgadmin:
  taskflow_redis:
  taskflow_redisinsight:
  taskflow_rabbitmq: